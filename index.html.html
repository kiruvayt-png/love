<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Vidumini ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden;background:#050505;color:#fff}
body:before{content:"";position:fixed;inset:-40px;background:radial-gradient(circle at 20% 20%,rgba(255,0,80,.16),transparent 32%),radial-gradient(circle at 80% 70%,rgba(140,0,255,.14),transparent 34%),linear-gradient(135deg,#020202,#101010 50%,#030303);filter:blur(22px);z-index:-2}
body:after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(5px);z-index:-1}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative}
.glass{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);box-shadow:0 18px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:32px}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.enter{padding:26px 34px;min-width:min(88vw,390px);text-align:center;font-size:20px;font-weight:800;cursor:pointer}
.enter span{display:inline-block;animation:pulse 1.6s infinite}@keyframes pulse{50%{transform:scale(1.035)}}
#main{display:none;min-height:100vh}#main.show{display:flex}
.main-card{width:min(92vw,680px);padding:42px 26px 34px;text-align:center;position:relative;z-index:2}
.love-title{font-size:clamp(34px,8vw,62px);font-weight:900;color:#ff2d55;letter-spacing:-1.5px;min-height:1.2em;text-shadow:0 0 18px rgba(255,45,85,.35)}
.name{margin-top:14px;font-size:clamp(25px,6vw,42px);font-weight:850;color:#fff;min-height:1.3em;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.photo-wrap{margin:28px auto 0;width:min(68vw,330px);aspect-ratio:1;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.32);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.photo-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.book{position:fixed;top:max(18px,env(safe-area-inset-top));right:18px;z-index:10;width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;color:#fff}
.copy{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:11px;letter-spacing:1.2px;color:rgba(255,255,255,.55);z-index:5}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}.heart{position:absolute;top:-40px;opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(360deg);opacity:0}}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}.letter{width:min(92vw,620px);max-height:82vh;overflow:auto;padding:34px 28px 30px;background:rgba(255,255,255,.92);color:#050505;border:1px solid rgba(255,255,255,.7);border-radius:30px;box-shadow:0 25px 90px rgba(0,0,0,.65)}
.close{float:right;border:0;background:rgba(0,0,0,.08);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
.letter h2{clear:both;padding-top:16px;margin:8px 0 22px;font-size:clamp(27px,6vw,40px);font-weight:850;text-shadow:0 1px 4px rgba(0,0,0,.18)}
.letter p{font-size:clamp(17px,4.3vw,21px);line-height:1.75;font-weight:550;white-space:pre-line;text-shadow:0 1px 3px rgba(0,0,0,.12)}
@media(min-width:700px){.main-card{padding:52px 48px 42px}.photo-wrap{width:300px}}
</style>
</head>

<div class="modal" id="modal"><div class="letter"><button class="close" id="closeBtn">×</button><h2 id="letterTitle"></h2><p id="letterBody"></p></div></div>
<script>
const intro=document.getElementById('intro'),main=document.getElementById('main'),enter=document.getElementById('enterBtn');
function typeText(el,text,speed,done){el.textContent='';let i=0;const t=setInterval(()=>{el.textContent+=text[i++]||'';if(i>=text.length){clearInterval(t);if(done)done()}},speed)}
enter.onclick=()=>{intro.classList.add('hide');main.classList.add('show');setTimeout(()=>typeText(document.getElementById('loveTitle'),'I LOVE YOU ❤️',90,()=>typeText(document.getElementById('name'),'𝙼𝚊𝚐𝚎 𝚅𝚒𝚍𝚞𝚖𝚒𝚗𝚒 𝙼𝚊𝚗𝚒𝚔𝚊 ❤️',70)),500)};
function makeHeart(){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','🩷','💕','💗'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.fontSize=12+Math.random()*18+'px';h.style.setProperty('--drift',(-80+Math.random()*160)+'px');h.style.animationDuration=5+Math.random()*6+'s';document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),12000)}
setInterval(makeHeart,450);
const modal=document.getElementById('modal');
document.getElementById('bookBtn').onclick=()=>{modal.classList.add('open');typeText(document.getElementById('letterTitle'),'My Vidumini, ❤️',65,()=>typeText(document.getElementById('letterBody'),`Since you came into my life, every day has become a little more beautiful. Your smile, your words, and your love mean more to me than you could ever know. 🥹❤️

I love you so much, my love. Today, tomorrow, and forever… ❤️♾️`,18))};
document.getElementById('closeBtn').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
</script>
